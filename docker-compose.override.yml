# Локальная разработка (compose подхватывает этот файл автоматически).
# Базовый docker-compose.yml — прод-режим (--no-dev); здесь dev: dev-пакеты, миграции, свежий код.
services:
  php:
    environment:
      APP_ENV: dev
      APP_DEBUG: 1
    command: >
      sh -c "composer install --no-interaction --prefer-dist
      && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
      && php-fpm"

  nginx:
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      php:
        condition: service_started
