name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  backend:
    name: Backend (PHP 8.3)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: symfony
          POSTGRES_PASSWORD: symfony
          POSTGRES_DB: symfony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U symfony -d symfony"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://symfony:symfony@127.0.0.1:5432/symfony?serverVersion=15&charset=utf8

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, mbstring, intl, pcntl, bcmath, gd, exif, zip
          coverage: pcov
          tools: composer:v2

      - name: Composer validate
        run: composer validate --no-check-publish

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Migrations + schema validate
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          php bin/console doctrine:schema:validate

      - name: Create test DB + migrate
        env:
          APP_ENV: test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration

      - name: PHPUnit
        env:
          APP_ENV: test
        run: vendor/bin/phpunit --coverage-text

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Deptrac (границы слоёв)
        run: vendor/bin/deptrac analyse --no-progress

      - name: PHP CS Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

