services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN}
      APP_VERSION: ${APP_VERSION:-dev}
      COMPOSER_ALLOW_SUPERUSER: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    command: >
      sh -c "composer install --no-dev --no-scripts --optimize-autoloader --no-interaction
      && php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=prod
      && php bin/console cache:clear --env=prod --no-debug
      && php bin/console cache:warmup --env=prod
      && php-fpm"
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5532}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    ports:
      - "${APP_PORT:-8108}:80"
    depends_on:
      php:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

volumes:
  db_data:

networks:
  default:
    # Своя сеть на стек: агентские стеки не видят друг друга и не конфликтуют
    # по именам сервисов (см. инструкцию «Изоляция стеков»).
    name: ${COMPOSE_PROJECT_NAME:-med_drive_api}_net
